name: CodeQL

on:
  push:
    branches: [main]
    paths-ignore:
      - '.agents/pm/**'
      - '**/*.md'
      - 'docs/**'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.agents/pm/**'
      - '**/*.md'
      - 'docs/**'
      - 'package-lock.json'
  schedule:
    # Weekly CodeQL scan, minute/hour staggered across the pm fleet so the
    # repos do not all fire against the API at the same time.
    - cron: "17 3 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    # Bounded like the CI jobs: a stuck analysis must not hold one of the account's 20 hosted slots for 6 h.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          # These packages are analyzed from source without a compiled build.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: "/language:javascript-typescript"
