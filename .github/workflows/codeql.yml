name: CodeQL

on:
  push:
    branches: [main]
    # Ordered filters preserve scans for executable tracker code and extensions.
    paths:
      - '**'
      - '!.agents/pm/**'
      - '!**/*.md'
      - '!docs/**'
      - '!package-lock.json'
      - '!bun.lock'
      - '!bun.lockb'
      - '!pnpm-lock.yaml'
      - '!yarn.lock'
      - '!npm-shrinkwrap.json'
      - '.agents/pm/**/*.mjs'
      - '.agents/pm/**/*.cjs'
      - '.agents/pm/**/*.js'
      - '.agents/pm/**/*.jsx'
      - '.agents/pm/**/*.ts'
      - '.agents/pm/**/*.tsx'
      - '.agents/pm/**/*.mts'
      - '.agents/pm/**/*.cts'
      - '.agents/pm/**/*.sh'
      - '.agents/pm/extensions/**'
  pull_request:
    branches: [main]
    # Ordered filters preserve scans for executable tracker code and extensions.
    paths:
      - '**'
      - '!.agents/pm/**'
      - '!**/*.md'
      - '!docs/**'
      - '!package-lock.json'
      - '!bun.lock'
      - '!bun.lockb'
      - '!pnpm-lock.yaml'
      - '!yarn.lock'
      - '!npm-shrinkwrap.json'
      - '.agents/pm/**/*.mjs'
      - '.agents/pm/**/*.cjs'
      - '.agents/pm/**/*.js'
      - '.agents/pm/**/*.jsx'
      - '.agents/pm/**/*.ts'
      - '.agents/pm/**/*.tsx'
      - '.agents/pm/**/*.mts'
      - '.agents/pm/**/*.cts'
      - '.agents/pm/**/*.sh'
      - '.agents/pm/extensions/**'
  schedule:
    # Weekly CodeQL scan, minute/hour staggered across the pm fleet so the
    # repos do not all fire against the API at the same time.
    - cron: "17 3 * * 1"

# Jobs opt into only the permissions they need.
permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    permissions:
      security-events: write
      actions: read
      contents: read
    runs-on: ubuntu-latest
    # Bounded like the CI jobs: a stuck analysis must not hold one of the account's 20 hosted slots for 6 h.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: javascript-typescript
          # These packages are analyzed from source without a compiled build.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:javascript-typescript"
