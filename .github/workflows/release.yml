name: Daily Release

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TIMEZONE: Europe/Vienna
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Decide release
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          latest_tag="$(git tag --sort=-creatordate | head -n 1 || true)"
          if [[ -n "$latest_tag" ]] && git diff --quiet "$latest_tag"..HEAD -- .; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
            echo "No changes since $latest_tag; skipping release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          release_date="$(TZ="$RELEASE_TIMEZONE" date +%Y.%m.%d)"
          base_tag="v${release_date}"
          max_suffix=-1
          while IFS= read -r existing_tag; do
            if [[ "$existing_tag" == "$base_tag" ]]; then
              (( max_suffix < 0 )) && max_suffix=0
              continue
            fi
            if [[ "$existing_tag" == "$base_tag-"* ]]; then
              suffix="${existing_tag#"$base_tag-"}"
              if [[ "$suffix" =~ ^[0-9]+$ ]] && (( suffix > max_suffix )); then
                max_suffix="$suffix"
              fi
            fi
          done < <(git tag -l "${base_tag}*")

          if (( max_suffix >= 0 )); then
            tag="${base_tag}-$((max_suffix + 1))"
          else
            tag="$base_tag"
          fi

          version_core="${tag#v}"
          year="${version_core%%.*}"
          version_tail="${version_core#*.}"
          month="${version_tail%%.*}"
          day_and_suffix="${version_tail#*.}"
          day="${day_and_suffix%%-*}"
          suffix="${day_and_suffix#"$day"}"
          npm_version="$((10#$year)).$((10#$month)).$((10#$day))${suffix}"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update release version
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm version "${{ steps.decide.outputs.npm_version }}" --no-git-tag-version --allow-same-version
          node -e "const fs=require('node:fs');const version=JSON.parse(fs.readFileSync('package.json','utf8')).version;for(const file of ['manifest.json']){if(!fs.existsSync(file))continue;const json=JSON.parse(fs.readFileSync(file,'utf8'));json.version=version;fs.writeFileSync(file,JSON.stringify(json,null,2)+'\n');}if(fs.existsSync('index.ts')){const source=fs.readFileSync('index.ts','utf8');const next=source.replace(/version:\s*[\"'][^\"']+[\"']/,'version: \"'+version+'\"');if(next!==source)fs.writeFileSync('index.ts',next);}"
          npm run build

      - name: Generate changelog and release notes
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx pm-changelog --pm-root .agents/pm --mode prepend --output CHANGELOG.md --since-previous-tag --until-release-tag --release-version-from-package --item-url-base https://github.com/unbraind/pm-csv/blob/main/.agents/pm --respect-item-release --pm-bin ./node_modules/.bin/pm --github-step-summary
          npx pm-changelog --pm-root .agents/pm --mode prepend --output CHANGELOG.md --since-previous-tag --until-release-tag --release-version-from-package --item-url-base https://github.com/unbraind/pm-csv/blob/main/.agents/pm --respect-item-release --pm-bin ./node_modules/.bin/pm --check
          npx pm-changelog --pm-root .agents/pm --stdout --since-previous-tag --until-release-tag --release-version-from-package --item-url-base https://github.com/unbraind/pm-csv/blob/main/.agents/pm --respect-item-release --pm-bin ./node_modules/.bin/pm > RELEASE_NOTES.md

      - name: Run release checks
        if: steps.decide.outputs.should_release == 'true'
        run: npm run release:check

      - name: Commit release files
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths=(package.json package-lock.json manifest.json CHANGELOG.md)
          [[ -f index.ts ]] && paths+=(index.ts)
          [[ -d src ]] && paths+=(src)
          git add "${paths[@]}"
          if git diff --cached --quiet; then
            echo "Release files are already current; tagging existing commit."
          else
            git commit -m "Release ${{ github.event.repository.name }} ${{ steps.decide.outputs.tag }}"
          fi

      # Refuse non-main release runs BEFORE publishing. `github.ref` is the
      # authoritative workflow trigger ref: schedule -> refs/heads/main;
      # workflow_dispatch from main -> refs/heads/main; workflow_dispatch from a
      # feature branch -> refs/heads/<feature> (refused here). Checking the
      # trigger ref (rather than git topology) reliably distinguishes a feature
      # branch from main, which commit-topology checks cannot do (a feature
      # branch off main is also a descendant of origin/main).
      - name: Check release ref
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Refusing to release from non-main ref ('$GITHUB_REF'). Run the release workflow from main."
            exit 1
          fi

      # Persist validated release metadata through the repository's protected
      # branch policy before publishing an immutable npm artifact. A stable
      # branch name lets a failed run update/reuse its open release PR, while
      # the exact remote SHA lease prevents overwriting another actor's work.
      - name: Merge release metadata through protected PR
        if: steps.decide.outputs.should_release == 'true'
        id: release_pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_SHA: ${{ steps.decide.outputs.base_sha }}
          RELEASE_TAG: ${{ steps.decide.outputs.tag }}
          NPM_VERSION: ${{ steps.decide.outputs.npm_version }}
        run: |
          set -euo pipefail
          git fetch origin main --force
          current_main_sha="$(git rev-parse origin/main)"
          if [[ "$current_main_sha" != "$RELEASE_BASE_SHA" ]]; then
            echo "::error::main advanced from ${RELEASE_BASE_SHA} to ${current_main_sha} while preparing the release. Retry from the new main head."
            exit 1
          fi

          release_branch="release/${RELEASE_TAG#v}"
          release_commit="$(git rev-parse HEAD)"
          if [[ "$release_commit" == "$current_main_sha" ]]; then
            echo "Release metadata is already present on main; resuming the publish/tag transaction."
            if git ls-remote --exit-code --heads origin "refs/heads/${release_branch}" > /dev/null 2>&1; then
              git push origin --delete "$release_branch"
            fi
            {
              echo "merged_sha=$current_main_sha"
              echo "pr_number="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_branch_sha="$(git ls-remote --heads origin "refs/heads/${release_branch}" | cut -f1)"
          if [[ -n "$remote_branch_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${release_branch}:${remote_branch_sha}" \
              origin "HEAD:refs/heads/${release_branch}"
          else
            git push origin "HEAD:refs/heads/${release_branch}"
          fi

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$release_branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "$pr_number" ]]; then
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$release_branch" \
              --title "Release pm-csv ${RELEASE_TAG}" \
              --body "Automated daily release metadata for \`${RELEASE_TAG}\`. The release gate passed before this PR was created; npm publication and tagging remain blocked until this protected PR is merged. Tracking: [pm-csv-exz4](https://github.com/unbraind/pm-csv/blob/main/.agents/pm/issues/pm-csv-exz4.toon).")"
            pr_number="${pr_url##*/}"
          fi

          # A 404 means no required checks are configured, which is a real answer.
          # Any other failure - outage, rate limit, missing token scope - must not
          # be read as "nothing is required", because that silently restores the
          # race this step exists to remove.
          protection_out="$(mktemp)"
          if gh api \
               "repos/${GITHUB_REPOSITORY}/branches/main/protection/required_status_checks" \
               --jq '[.contexts[]?]' > "$protection_out" 2>"${protection_out}.err"; then
            required_json="$(cat "$protection_out")"
          elif grep -qi 'not found\|HTTP 404' "${protection_out}.err"; then
            required_json='[]'
            echo "No required status checks configured on main; merging without waiting."
          else
            echo "::error::Could not read branch protection for ${GITHUB_REPOSITORY}: $(tr '\n' ' ' < "${protection_out}.err")"
            exit 1
          fi
          rm -f "$protection_out" "${protection_out}.err"

          if [[ "$(jq -r 'length' <<< "$required_json")" != "0" ]]; then
            deadline=$(( SECONDS + 1800 ))
            while :; do
              rollup="$(gh pr view "$pr_number" \
                --repo "$GITHUB_REPOSITORY" \
                --json statusCheckRollup \
                --jq '[.statusCheckRollup[]?
                       | {name: (.name // .context),
                          state: (.conclusion // .state // .status // "PENDING")}]')"
              report="$(jq -n --argjson req "$required_json" --argjson all "$rollup" \
                '[$req[] as $name
                  | ($all | map(select(.name == $name)) | last)
                  | {name: ($name), state: (.state // "EXPECTED")}]')"
              # Allowlist the states that mean "settled and acceptable"; classify
              # every explicit non-passing conclusion as a failure; treat anything
              # else - REQUESTED, WAITING, a state GitHub adds later - as still
              # pending. A denylist would let an unrecognised state read as
              # settled and fire the merge into a check that never ran, which is
              # the failure this step exists to prevent.
              pending="$(jq -r '[.[] | select((.state | IN("SUCCESS", "NEUTRAL", "SKIPPED",
                                                           "FAILURE", "ERROR", "TIMED_OUT",
                                                           "CANCELLED", "ACTION_REQUIRED",
                                                           "STARTUP_FAILURE", "STALE")) | not)
                                 | .name] | join(", ")' <<< "$report")"
              failed="$(jq -r '[.[] | select(.state | IN("FAILURE", "ERROR", "TIMED_OUT",
                                                         "CANCELLED", "ACTION_REQUIRED",
                                                         "STARTUP_FAILURE", "STALE"))
                                 | .name] | join(", ")' <<< "$report")"
              if [[ -n "$failed" ]]; then
                echo "::error::Required checks failed on release PR #${pr_number}: ${failed}. Not merging or publishing."
                exit 1
              fi
              if [[ -z "$pending" ]]; then
                break
              fi
              if (( SECONDS >= deadline )); then
                echo "::error::Required checks on release PR #${pr_number} did not settle within 30 minutes; still waiting on: ${pending}."
                exit 1
              fi
              echo "Waiting for required checks on PR #${pr_number}: ${pending}"
              sleep 20
            done
          fi

          merged_sha="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
            -f merge_method=rebase \
            -f sha="$release_commit" \
            --jq '.sha')"
          if [[ -z "$merged_sha" || "$merged_sha" == "null" ]]; then
            echo "::error::GitHub did not return the merged main SHA for release PR #${pr_number}."
            exit 1
          fi

          if git ls-remote --exit-code --heads origin "refs/heads/${release_branch}" > /dev/null 2>&1; then
            git push origin --delete "$release_branch"
          fi
          {
            echo "merged_sha=$merged_sha"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"
          echo "Merged release metadata PR #${pr_number} at ${merged_sha}." >> "$GITHUB_STEP_SUMMARY"

      # The release PR can only contain the prepared release commit because the
      # base SHA is checked immediately before creation. Re-check the exact
      # merged main commit anyway so npm always receives byte-for-byte validated
      # repository state, and fail safely before publication if main moved.
      - name: Verify merged release
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          MERGED_SHA: ${{ steps.release_pr.outputs.merged_sha }}
          NPM_VERSION: ${{ steps.decide.outputs.npm_version }}
        run: |
          set -euo pipefail
          git fetch origin main --force
          git checkout --detach origin/main
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$MERGED_SHA" ]]; then
            echo "::error::main advanced from merged release ${MERGED_SHA} to ${actual_sha} before publication. Retry to rebuild release metadata on the new head."
            exit 1
          fi

          actual_version="$(npm pkg get version | tr -d '"')"
          if [[ "$actual_version" != "$NPM_VERSION" ]]; then
            echo "::error::Merged package version ${actual_version} does not match intended release ${NPM_VERSION}."
            exit 1
          fi

          npm ci
          npm run release:check
          git diff --exit-code -- \
            package.json package-lock.json manifest.json index.ts CHANGELOG.md

      - name: Publish npm package
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_VERSION: ${{ steps.decide.outputs.npm_version }}
        run: |
          set -euo pipefail
          pkg_name="$(node -p "require('./package.json').name")"
          if npm view "${pkg_name}@${NPM_VERSION}" version --json >/dev/null 2>&1; then
            echo "::notice::${pkg_name}@${NPM_VERSION} already published; skipping publish step."
            exit 0
          fi
          publish_with_provenance() {
            npm publish --access public --provenance --ignore-scripts
          }
          publish_without_provenance() {
            echo "::warning::Falling back to publish WITHOUT --provenance after repeated 404 from npm registry."
            npm publish --access public --ignore-scripts
          }
          attempt=0
          max_attempts=3
          while (( attempt < max_attempts )); do
            attempt=$(( attempt + 1 ))
            if publish_with_provenance; then
              echo "Published with provenance on attempt ${attempt}."
              exit 0
            fi
            if npm view "${pkg_name}@${NPM_VERSION}" version --json >/dev/null 2>&1; then
              echo "::notice::Version landed despite reported error; treating as success."
              exit 0
            fi
            echo "Publish attempt ${attempt}/${max_attempts} failed; sleeping 30s before retry..."
            sleep 30
          done
          echo "::warning::All ${max_attempts} provenance publish attempts failed; trying once without provenance."
          if publish_without_provenance; then
            echo "Published without provenance."
            exit 0
          fi
          if npm view "${pkg_name}@${NPM_VERSION}" version --json >/dev/null 2>&1; then
            echo "::notice::Version landed during fallback; treating as success."
            exit 0
          fi
          echo "::error::Publish failed after retries and provenance fallback."
          exit 1

      # Tag the exact merged/verified main commit AFTER a successful publish.
      # main was already advanced by the protected release PR above, so this step
      # only creates/pushes the tag. If publication fails, main retains the
      # prepared metadata and the next run resumes the same version instead of
      # inventing another release.
      - name: Push release tag
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          if git rev-parse --verify --quiet "refs/tags/${release_tag}" > /dev/null; then
            existing_sha="$(git rev-list -n 1 "$release_tag")"
            current_sha="$(git rev-parse HEAD)"
            if [[ "$existing_sha" != "$current_sha" ]]; then
              echo "::error::${release_tag} already points to ${existing_sha}, not verified main ${current_sha}."
              exit 1
            fi
          else
            git tag "$release_tag"
          fi
          git push origin "refs/tags/${release_tag}"

      - name: Verify bun install of published package
        if: steps.decide.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="${{ steps.decide.outputs.npm_version }}"
          mkdir -p /tmp/bun-verify
          cd /tmp/bun-verify
          rm -rf node_modules bun.lockb package.json
          bun init -y > /dev/null
          # Smoke-test that the just-published version installs via bun.
          # Retry to absorb npm registry propagation (~60s typical).
          for attempt in 1 2 3 4 5 6 7 8; do
            if bun add "${pkg_name}@${pkg_version}"; then
              echo "bun add succeeded on attempt $attempt"
              exit 0
            fi
            echo "bun add failed on attempt $attempt, sleeping 30s..."
            sleep 30
          done
          # bun's registry mirror can lag well past npm's own propagation,
          # especially for prerelease (-N) versions. The npm registry is
          # authoritative for what we just published: if it confirms the
          # version, the release genuinely succeeded and the bun failure is
          # mirror lag, not a publish failure. Do not let it block the
          # GitHub release / post-publish steps that follow.
          echo "bun could not resolve ${pkg_name}@${pkg_version}; checking npm registry authoritatively..."
          if npm view "${pkg_name}@${pkg_version}" version --registry="https://registry.npmjs.org" > /dev/null 2>&1; then
            echo "::warning::bun has not mirrored ${pkg_name}@${pkg_version} yet, but npm confirms it is published (registry mirror lag). Treating verification as successful."
            exit 0
          fi
          echo "npm registry does not show ${pkg_name}@${pkg_version} - real publish failure."
          exit 1
      - name: Create GitHub release
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.decide.outputs.tag }}" --title "${{ github.event.repository.name }} ${{ steps.decide.outputs.tag }}" --notes-file RELEASE_NOTES.md --verify-tag
