name: CI Deep

# Exhaustive validation is observational after merge; never a required PR check.
on:
  push:
    branches: [main]
  schedule:
    # Daily off-peak run, separate from release.yml (03:23) and CodeQL (03:17).
    - cron: "47 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: true

# Distinct check names prevent a manual branch run from matching required PR checks.
jobs:
  deep:
    # Busy local slots must queue. Only the fleet controller disables this pool
    # after all local hosts have been unreachable for ten minutes.
    runs-on: ${{ vars.PM_LOCAL_DEEP != 'off' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    # Pilot exception: full coverage measured 80m 41s per gate on the shared host.
    # Two gates exceed 160m before packing; retain headroom for slow local IO.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
    env:
      PM_TEST_DEPTH: full
      # Acceptance watchdogs allow slower local installs without becoming unbounded.
      PM_TEST_TIME_SCALE: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        run: ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      - name: Full npm release gate
        run: npm run release:check

      - name: Full Bun release gate
        run: bun run release:check

      - name: Verify Bun can install the package graph
        run: bun install --no-save
