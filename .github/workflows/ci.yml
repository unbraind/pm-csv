name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify pm tracker integrity
        shell: bash
        run: |
          set -euo pipefail
          # WHAT THIS CATCHES, all visible in a fresh checkout: conflict markers left in
          # item or history files, item parse failures, invalid history JSON, history hash
          # drift, unknown-author history events, stale in-progress work, and tracked
          # runtime cache files.
          #
          # WHAT THIS DOES NOT CATCH - stated explicitly so nobody relies on it. It does
          # NOT detect a merge that silently discarded a peer agent's edit. When two
          # branches edit the same scalar field, the field-aware driver keeps one value and
          # records the discarded one in a merge receipt under .agents/pm/runtime/, which
          # `pm init` gitignores, so the receipt is never pushed. A fresh checkout of that
          # commit reports zero pending decisions and this step exits 0 - verified
          # directly, not assumed. The pushed history does not disambiguate it either:
          # both writes are present in timestamp order and the item matches the latest, so
          # `pm history <id> --verify` reports ok too. Tracked upstream as
          # unbraind/pm-cli#922. Do not add a comment here claiming merge safety until
          # that is closed.
          #
          # --strict-exit is load-bearing: a bare `pm health` exits 0 EVEN WHEN ok:false,
          # so without this flag the step is a no-op that always passes.
          #
          # A fresh runner checkout has no merge drivers installed. That is a warn, not a
          # failure (upstream GH-815), so this gate does not need `pm merge install`.
          ./node_modules/.bin/pm health --strict-exit

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage gate
        run: npm run coverage

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Verify npm package contents
        run: npm run pack:dry-run

      - name: Verify generated changelog
        run: npm run changelog:check

      - name: Verify Bun can install the package graph
        run: bun install --no-save
