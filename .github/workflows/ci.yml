name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Same PR grouping as the local-runner pilot (#254); manual runs stay independent.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Required checks stay on fast GitHub-hosted hardware.
    runs-on: ubuntu-latest
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Checkout must precede this first decision. NUL delimiters handle unusual
      # filenames; compare the actual PR endpoints, not the synthetic merge commit.
      # Disable rename folding so moving source into docs still counts its deletion.
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # This tracker-root file is executable code, not tracker data.
                .agents/pm/verify-release-yaml.mjs) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify release workflow contract
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run verify:release-workflow

      - name: Verify tracked pm project health
        if: steps.changes.outputs.code != 'true' || matrix.node-version == 26
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      # No standalone markdown linter exists. These small suites enforce the
      # existing README/docs, shipped changelog and public commit contracts.
      - name: Check documentation and tracker changes
        if: steps.changes.outputs.code != 'true'
        run: |
          npm run changelog:check
          node --test test/packaging.test.ts test/shipped-changelog.test.ts test/identity-audit.test.ts

      - name: Engines floor tests
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 22
        run: npm test

      - name: Quick npm release gate
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run release:check

      # accept:packed in the gate already exercises Bun project/global installs
      # and bunx ephemeral CLI + tarball extension installs (with real CSV IO).
      - name: Verify Bun can install the package graph
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: bun install --no-save
